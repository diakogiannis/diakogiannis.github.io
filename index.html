<style>
  :root {
    --bg: #07080c;
    --panel: #0c0f16;
    --panel-hover: #10141e;
    --line: #1f2635;
    --text: #e6edf3;
    --muted: #8a94a6;
    --cyan: #00f0ff;
    --magenta: #ff2bd6;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --cut: 12px;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background:
      radial-gradient(ellipse 80% 45% at 50% -10%, rgba(255, 43, 214, 0.16), transparent 70%),
      radial-gradient(ellipse 70% 40% at 50% 110%, rgba(0, 240, 255, 0.12), transparent 70%),
      var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.5;
    overflow-x: hidden;
  }

  /* Grid in the background */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(0, 240, 255, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 240, 255, 0.06) 1px, transparent 1px);
    background-size: 32px 32px;
    -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
    mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
    z-index: 0;
  }

  /* CRT scanlines */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 0 1px, transparent 1px 3px);
    z-index: 10;
  }

  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    padding: max(40px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
  }

  /* ---------- Header ---------- */
  header { text-align: center; }

  .prompt {
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--cyan);
    letter-spacing: 0.08em;
    margin: 0 0 18px;
    opacity: 0.85;
  }
  .prompt .cursor {
    display: inline-block;
    width: 0.55em;
    height: 1em;
    margin-left: 4px;
    vertical-align: -2px;
    background: var(--cyan);
    animation: blink 1.1s steps(1) infinite;
  }

  .avatar {
    position: relative;
    width: 132px;
    height: 132px;
    margin: 0 auto 22px;
  }
  .avatar::before {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: conic-gradient(from 210deg, var(--cyan), var(--magenta), var(--cyan));
    filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.45)) drop-shadow(0 0 18px rgba(255, 43, 214, 0.25));
  }
  .avatar::after {
    content: "";
    position: absolute;
    inset: -13px;
    border-radius: 50%;
    border: 1px dashed rgba(0, 240, 255, 0.55);
    animation: spin 24s linear infinite;
  }
  .avatar-inner {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    overflow: hidden;
    background: #0a0d14;
    border: 3px solid var(--bg);
    display: grid;
    place-items: center;
  }
  .initials {
    font-family: var(--mono);
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--cyan);
    letter-spacing: 0.05em;
    text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
  }
  .avatar img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .name {
    position: relative;
    margin: 0 0 6px;
    font-family: var(--mono);
    font-size: clamp(1.35rem, 6vw, 1.85rem);
    font-weight: 700;
    letter-spacing: 0.03em;
    line-height: 1.25;
    text-shadow: 0 0 18px rgba(0, 240, 255, 0.25);
  }
  .name::before,
  .name::after {
    content: attr(data-text);
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
  }
  .name::before { color: var(--magenta); animation: glitch-a 7s infinite steps(1); }
  .name::after  { color: var(--cyan);    animation: glitch-b 7s infinite steps(1); }

  .aka {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin: 0 0 12px;
  }

  .roles {
    font-family: var(--mono);
    font-size: 0.82rem;
    color: var(--cyan);
    margin: 0 0 12px;
    letter-spacing: 0.02em;
  }
  .roles .sep { color: var(--magenta); padding: 0 4px; }

  .bio {
    margin: 0 auto;
    max-width: 440px;
    font-size: 0.92rem;
    color: var(--muted);
  }
  .bio p { margin: 0 0 4px; }
  .bio strong { color: var(--text); font-weight: 600; }
  .bio .lead { margin-bottom: 10px; }

  /* ---------- Sections ---------- */
  section { margin-top: 34px; }

  .section-title {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 12px;
    font-family: var(--mono);
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .section-title::before { content: "//"; color: var(--magenta); }
  .section-title::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--line), transparent);
  }

  ul.links {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 12px;
  }
  ul.links li { transition: filter 0.2s ease; }
  ul.links li:hover,
  ul.links li:focus-within { filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.35)); }

  .link {
    display: block;
    padding: 1px;
    text-decoration: none;
    color: inherit;
    background: var(--line);
    clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
    transition: background 0.2s ease, transform 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .link-body {
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 62px;
    padding: 12px 16px;
    background: var(--panel);
    clip-path: inherit;
    transition: background 0.2s ease;
  }
  .link:hover,
  .link:focus-visible { background: linear-gradient(120deg, var(--cyan), var(--magenta)); }
  .link:hover .link-body,
  .link:focus-visible .link-body { background: var(--panel-hover); }
  .link:active { transform: scale(0.985); }
  .link:focus-visible { outline: none; }

  .icon {
    flex: 0 0 auto;
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    color: var(--cyan);
    border: 1px solid rgba(0, 240, 255, 0.3);
    background: rgba(0, 240, 255, 0.05);
  }
  .icon svg { width: 20px; height: 20px; }

  .text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .title { font-weight: 600; font-size: 0.98rem; }
  .sub {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--muted);
    overflow-wrap: anywhere;
  }

  .arrow {
    flex: 0 0 auto;
    width: 18px;
    height: 18px;
    color: var(--muted);
    transition: color 0.2s ease, transform 0.2s ease;
  }
  .link:hover .arrow,
  .link:focus-visible .arrow { color: var(--magenta); transform: translate(2px, -2px); }

  /* Featured article card */
  .link.article .link-body { align-items: flex-start; padding: 16px; }
  .article .kicker {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--magenta);
    margin-bottom: 4px;
  }
  .article .title { font-size: 1rem; line-height: 1.35; }
  .article .desc { font-size: 0.86rem; color: var(--muted); margin-top: 4px; line-height: 1.4; }
  .article .sub { margin-top: 8px; }

  /* ---------- Footer ---------- */
  footer {
    margin-top: 44px;
    text-align: center;
    font-family: var(--mono);
    font-size: 0.72rem;
    color: #5c6577;
    letter-spacing: 0.06em;
  }
  footer .eot { color: var(--magenta); opacity: 0.7; }

  /* ---------- Animations ---------- */
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes glitch-a {
    0%, 90%, 100% { opacity: 0; transform: none; clip-path: inset(0); }
    91% { opacity: 0.85; transform: translate(-3px, 0); clip-path: inset(8% 0 62% 0); }
    93% { opacity: 0.85; transform: translate(3px, 0);  clip-path: inset(58% 0 18% 0); }
    95% { opacity: 0.85; transform: translate(-1px, 0); clip-path: inset(30% 0 44% 0); }
    97% { opacity: 0; }
  }
  @keyframes glitch-b {
    0%, 90%, 100% { opacity: 0; transform: none; clip-path: inset(0); }
    92% { opacity: 0.85; transform: translate(3px, 0);  clip-path: inset(40% 0 35% 0); }
    94% { opacity: 0.85; transform: translate(-2px, 0); clip-path: inset(70% 0 5% 0); }
    96% { opacity: 0.85; transform: translate(2px, 0);  clip-path: inset(12% 0 70% 0); }
    98% { opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  @media (min-width: 600px) {
    .wrap { padding-top: 64px; }
  }
</style>
</head>
